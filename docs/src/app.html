<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta
			name="description"
			content="Formsnap — beautiful, accessible form primitives for SvelteKit Superforms. Type-safe fields, labels, descriptions and errors that wire themselves up."
		/>
		%sveltekit.head%
		<script>
			// Apply the stored or system theme before first paint to avoid a flash.
			(() => {
				let stored = null;
				try {
					stored = localStorage.getItem("formsnap-theme");
				} catch {}
				const theme =
					stored === "light" || stored === "dark"
						? stored
						: matchMedia("(prefers-color-scheme: light)").matches
							? "light"
							: "dark";
				document.documentElement.classList.toggle("dark", theme === "dark");
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
