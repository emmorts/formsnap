# Publishing `@emmorts/formsnap`.
#
# Cut a release with `npm run release -- <version>` (scripts/release.mjs). It generates a dated
# changelog section from Unreleased, bumps the manifest, commits, creates an annotated tag and
# pushes main and the tag atomically. The generated changelog is the source of release notes.
#
# The tag must equal `v<package version>`, or this workflow fails before publishing.
# npm authenticates with the OIDC trusted publisher configured for this repository and workflow
# file, so there is no npm token in this repository; provenance is generated automatically.
# The GitHub release notes are the `## <version>` section of the changelog, so users read the
# same text here and on npm.
name: Release

on:
    push:
        tags:
            - v*

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write # create the GitHub release
    id-token: write # npm trusted publishing

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install the browser used by the consumer tests
              run: pnpm --filter @emmorts/formsnap exec playwright install --with-deps chromium

            - name: Confirm the tag matches the package version
              run: |
                  declared="$(node -p "require('./packages/formsnap/package.json').version")"
                  if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
                    echo "::error::tag $GITHUB_REF_NAME does not match packages/formsnap version $declared"
                    exit 1
                  fi

            - name: Prepare release notes
              run: |
                  version="$(node -p "require('./packages/formsnap/package.json').version")"
                  node scripts/release-notes.mjs "$version" packages/formsnap/CHANGELOG.md > release-notes.md

            - name: Test release tooling
              run: node --test scripts/release.test.mjs

            - name: Type-check
              run: pnpm --filter @emmorts/formsnap run check

            - name: Test
              run: pnpm test:package

            - name: Build the package
              run: pnpm --filter @emmorts/formsnap run package

            - name: Publish
              run: npm publish --access public
              working-directory: packages/formsnap

            # Notes come from the changelog section that ships inside the tarball, so the GitHub
            # release and the package tell users the same story.
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="$(node -p "require('./packages/formsnap/package.json').version")"
                  gh release create "v$version" --repo "${{ github.repository }}" --title "v$version" --notes-file release-notes.md --verify-tag
