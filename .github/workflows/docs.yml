name: Documentation

# Publishes the docs app in docs/ as a static site on GitHub Pages. A pull request builds and
# uploads the same artifact without deploying it, which is what makes the build verifiable before
# it is published.
on:
    push:
        branches:
            - main
        paths:
            - docs/**
            - packages/formsnap/**
            - pnpm-lock.yaml
            - .github/workflows/docs.yml
    pull_request:
        paths:
            - docs/**
            - packages/formsnap/**
            - pnpm-lock.yaml
            - .github/workflows/docs.yml
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @emmorts/formsnap build
            - run: pnpm --filter @formsnap/docs build
              env:
                  GITHUB_ACTIONS: "true"
                  GITHUB_REPOSITORY: ${{ github.repository }}

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/build

    deploy:
        name: Deploy
        needs: build
        # A pull request only builds; a branch other than the default one is never published over
        # the live site, even when the workflow is triggered by hand.
        if: >-
            github.event_name != 'pull_request' &&
            github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
