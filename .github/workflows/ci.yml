name: CI

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install the browser used by the browser test project
              run: pnpm --filter @emmorts/formsnap exec playwright install --with-deps chromium

            - name: Lint
              run: pnpm lint

            - name: Test release tooling
              run: node --test scripts/release.test.mjs scripts/publish-release.test.mjs

            - name: Type-check
              run: pnpm --filter @emmorts/formsnap run check

            - name: Test
              run: pnpm test:package

            - name: Upload group recipe smoke screenshot
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: groups-smoke
                  path: /tmp/formsnap-groups.png
                  retention-days: 7

            - name: Build the package
              run: pnpm --filter @emmorts/formsnap run package

    # Build at the locked workspace baseline, then install the packed root entry in isolated
    # Kit 2 consumers at the advertised Svelte/Superforms edges. The shared remote fixture needs
    # Kit 3 and cannot run on the root minimum. Zod matches each Superforms adapter's API.
    compatibility:
        name: Compatibility (${{ matrix.description }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - description: Svelte 5.30.2, Superforms 2.19.0
                      svelte: "5.30.2"
                      superforms: "2.19.0"
                      zod: "3.25.76"
                    - description: Svelte 5.56.4, Superforms 3.0.0
                      svelte: "5.56.4"
                      superforms: "3.0.0"
                      zod: "4.6.5"
                    - description: Current Svelte 5, Superforms 3
                      svelte: "5"
                      superforms: "3"
                      zod: "4.6.5"
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the package at the locked baseline
              run: pnpm --filter @emmorts/formsnap run package

            - name: Prove the packed root entry at the matrix versions
              run: >-
                  node scripts/verify-package.mjs --root-only
                  --svelte=${{ matrix.svelte }}
                  --superforms=${{ matrix.superforms }}
                  --zod=${{ matrix.zod }}
                  --root-kit=2.70.3 --root-plugin=5.1.1 --root-vite=6.4.1

    # The remote entry imports no Superforms. Its isolated packed consumer installs none,
    # type-checks the actual app and renders/submits a native remote form. The full source
    # fixture/browser suite stays here and in verify; the root matrix proves classic native actions.
    #
    # Kit's experimental remote API is documented per backend, not encoded as a global peer:
    # a Kit 3 peer (even optional) would reject existing root Kit 2/Superforms 2 applications.
    # The remote requirement remains ^3.0.1, with 3.0.1 the tested baseline. This caret is not
    # evidence that every later Kit release was exercised. Add a changed Kit API version to
    # this matrix and pass it before changing the documented baseline; incompatible API
    # changes require a Formsnap release. Kit 2 remote forms are not claimed.
    remote:
        name: Remote (${{ matrix.description }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - description: Kit 3.0.1, Svelte 5.57.2, packed consumer without Superforms
                      svelte: "5.57.2"
                      kit: "3.0.1"
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install the matrix versions
              run: >-
                  pnpm --filter @emmorts/formsnap add -D --save-exact
                  svelte@${{ matrix.svelte }}
                  @sveltejs/kit@${{ matrix.kit }}

            - name: Install the browser used by the browser test project
              run: pnpm --filter @emmorts/formsnap exec playwright install --with-deps chromium

            - name: Type-check
              run: pnpm --filter @emmorts/formsnap run check

            - name: Test
              run: pnpm --filter @emmorts/formsnap test

            - name: Build the package
              run: pnpm --filter @emmorts/formsnap run package

            - name: Prove the packed artifact
              run: >-
                  node scripts/verify-package.mjs
                  --kit=${{ matrix.kit }}
                  --svelte=${{ matrix.svelte }}
